spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: site-guard
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai-courseware}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  # 品牌图标上传边界；业务层仍会再次校验 2 MiB 原始文件限制。
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  # 分页配置
  data:
    web:
      pageable:
        one-indexed-parameters: true
  # Quartz 调度器：使用 JDBC 持久化，schema 由 Spring Boot quartz starter 启动时自动建表
  # （spring-boot-starter-quartz 捆绑了官方 tables_*.sql，无需我们维护 DDL）
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org:
        quartz:
          scheduler:
            instanceName: SiteGuardScheduler
            instanceId: AUTO
          threadPool:
            threadCount: "5"

# app 配置
app:
  # 认证配置
  auth:
    # 固定管理员账号（明文，启动时 BCrypt 哈希入内存，不写库）
    admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin}
      nickname: 系统管理员
    jwt:
      issuer: site-guard
      secret: ${JWT_SECRET:ChangeThisSecretKeyInProduction_7gK9xQ2mLp8Zr4VnT6cW1yHs3DfA0bJu}
      access-token-ttl: 3600000      # 60 分钟
      refresh-token-ttl: 2592000000  # 30 天
  # 品牌图片存储及图像处理限制；生产容器目录位于持久化 /app/data 下。
  branding:
    storage:
      directory: ${BRANDING_STORAGE_DIRECTORY:./data/branding}
      max-upload-bytes: 2097152
      max-input-dimension: 8192
      max-input-pixels: 16777216
      max-output-dimension: 512
      max-output-bytes: 2097152

# SpringDoc OpenAPI 配置
# 日志配置：LOG_LEVEL 环境变量控制全局级别，默认 INFO
logging:
  level:
    root: ${LOG_LEVEL:INFO}
  file:
    name: ${LOG_FILE:./logs/site-guard.log}
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  group-configs:
    - group: admin
      packages-to-scan: com.codeages.aicourseware.api.admin
      paths-to-match: /api/v1/admin/**
    - group: open
      packages-to-scan: com.codeages.aicourseware.api.open
      paths-to-match: /api/v1/open/**